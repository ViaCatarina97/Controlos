<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Controlos — Plataforma de Gestão Operacional &amp; Financeira</title>
    <meta name="description" content="Torre de controlo operacional, posicionamento de equipa, tesouraria, faturação HAVI/MyStore, checklists de gerentes, agenda e plano de limpeza." />
    <meta property="og:title" content="Controlos — Gestão Operacional &amp; Financeira" />
    <meta property="og:description" content="Torre de controlo operacional, posicionamento de equipa, tesouraria, faturação HAVI/MyStore, checklists de gerentes, agenda e plano de limpeza." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      @page {
        size: A4 portrait;
        margin: 4mm;
      }

      @page landscape-print {
        size: A4 landscape;
        margin: 4mm;
      }

      .print-landscape {
        page: landscape-print !important;
      }

      @media print {
        /* A impressão bancária tem de apresentar apenas a guia específica,
           nunca a listagem de folhas que está por trás do botão. */
        body.printing-deposit-slip #finance-control-root > *:not(.deposit-slip-print) {
          display: none !important;
        }
        body.printing-deposit-slip,
        body.printing-deposit-slip #root,
        body.printing-deposit-slip #finance-control-root {
          page: landscape-print !important;
        }
        body.printing-deposit-slip #finance-control-root > .deposit-slip-print {
          display: block !important;
          page: landscape-print !important;
          position: static !important;
          inset: auto !important;
          width: 100% !important;
          min-height: 0 !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }
        body.printing-deposit-slip #finance-control-root {
          box-sizing: border-box !important;
          width: 100% !important;
          height: auto !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          border: 0 !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet {
          box-sizing: border-box !important;
          width: 100% !important;
          max-width: none !important;
          height: 202mm !important;
          min-height: 202mm !important;
          margin: 0 !important;
          padding: 4mm !important;
          border-width: 1mm !important;
          border-radius: 2mm !important;
          box-shadow: none !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: space-between !important;
          gap: 1mm !important;
          overflow: visible !important;
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet > * {
          flex-shrink: 0 !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet > :not([hidden]) ~ :not([hidden]) {
          margin-top: 0 !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet > .flex.justify-between {
          padding-bottom: 2mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet > .grid.grid-cols-12 {
          gap: 2mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .border-2 {
          border-width: 0.35mm !important;
          border-radius: 1.5mm !important;
          padding: 1.8mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .grid.grid-cols-12 {
          gap: 2mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet > .grid.grid-cols-12.border-t-2 {
          padding-top: 2mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet table th,
        body.printing-deposit-slip .deposit-slip-sheet table td {
          padding: 0.6mm 1.2mm !important;
          line-height: 1 !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet table tr.h-7 {
          height: 4mm !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet table {
          font-size: 7pt !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet table th {
          font-size: 6.5pt !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .text-2xl {
          font-size: 17pt !important;
          line-height: 1.1 !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .text-sm {
          font-size: 8pt !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .text-base {
          font-size: 9pt !important;
        }
        body.printing-deposit-slip .deposit-slip-sheet .text-\[8px\],
        body.printing-deposit-slip .deposit-slip-sheet .text-\[7px\] {
          font-size: 6pt !important;
        }
        html, body, #root {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white !important;
          width: 100% !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        ::-webkit-scrollbar {
          display: none;
        }
        aside,
        nav,
        header,
        .no-print {
          display: none !important;
        }
        main,
        main > div {
          height: auto !important;
          min-height: 0 !important;
          max-height: none !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        .print-container {
          position: static !important;
          width: 100% !important;
          display: block !important;
          margin: 0 !important;
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
