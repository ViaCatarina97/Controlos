<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Controlos — Plataforma de Gestão Operacional &amp; Financeira</title>
    <meta name="description" content="Torre de controlo operacional, posicionamento de equipa, tesouraria, faturação HAVI/MyStore, checklists de gerentes, agenda e plano de limpeza." />
    <meta property="og:title" content="Controlos — Gestão Operacional &amp; Financeira" />
    <meta property="og:description" content="Torre de controlo operacional, posicionamento de equipa, tesouraria, faturação HAVI/MyStore, checklists de gerentes, agenda e plano de limpeza." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      @page {
        size: A4 portrait;
        margin: 4mm;
      }

      @page landscape-print {
        size: A4 landscape;
        margin: 4mm;
      }

      .print-landscape {
        page: landscape-print !important;
      }

      @media print {
        /* A impressão bancária tem de apresentar apenas a guia específica,
           nunca a listagem de folhas que está por trás do botão. */
        body.printing-deposit-slip #finance-control-root > *:not(.deposit-slip-print) {
          display: none !important;
        }
        body.printing-deposit-slip #finance-control-root > .deposit-slip-print {
          display: block !important;
          position: static !important;
          inset: auto !important;
          width: 100% !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        html, body, #root {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white !important;
          width: 100% !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        ::-webkit-scrollbar {
          display: none;
        }
        aside,
        nav,
        header,
        .no-print {
          display: none !important;
        }
        main,
        main > div {
          height: auto !important;
          min-height: 0 !important;
          max-height: none !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        .print-container {
          position: static !important;
          width: 100% !important;
          display: block !important;
          margin: 0 !important;
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
