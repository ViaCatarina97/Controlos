    <style>
      @media print {
        @page {
          size: landscape;
          margin: 10mm;
        }
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white !important;
          width: 100%;
          height: 100%;
        }
        ::-webkit-scrollbar {
          display: none;
        }
        body * {
          visibility: hidden;
        }
        .print-container, .print-container * {
          visibility: visible;
        }
        .print-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          display: block !important;
        }
      }

      @page landscape-print {
        size: landscape;
        margin: 3mm;
      }
      .print-landscape {
        page: landscape-print !important;
      }
    </style>
